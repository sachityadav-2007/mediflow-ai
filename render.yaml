# =============================================================================
# MediFlow AI — Render Cloud Infrastructure Blueprint
# Deploys PostgreSQL 16, Express API + Socket.IO, FastAPI ML Service & React SPA
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # 1. Python FastAPI ML Microservice (Independent Inference Engine)
  # ---------------------------------------------------------------------------
  - type: web
    name: mediflow-ml-service
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r ml-service/requirements.txt
    startCommand: uvicorn app.main:app --app-dir ml-service --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "false"
      - key: ML_SERVICE_SECRET
        generateValue: true

  # ---------------------------------------------------------------------------
  # 2. Node.js Express REST API & Real-Time Socket.IO Gateway
  # ---------------------------------------------------------------------------
  - type: web
    name: mediflow-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd backend && npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: cd backend && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        fromDatabase:
          name: mediflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://mediflow-frontend.onrender.com,https://mediflow.vercel.app
      - key: ML_SERVICE_URL
        value: https://mediflow-ml-service.onrender.com
      - key: ML_SERVICE_SECRET
        fromService:
          type: web
          name: mediflow-ml-service
          envVarKey: ML_SERVICE_SECRET

  # ---------------------------------------------------------------------------
  # 3. React 18 + Vite Frontend SPA (Render Global Edge CDN)
  # ---------------------------------------------------------------------------
  - type: web
    name: mediflow-frontend
    runtime: static
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://mediflow-api.onrender.com

# -----------------------------------------------------------------------------
# 4. Managed Production PostgreSQL Database
# -----------------------------------------------------------------------------
databases:
  - name: mediflow-db
    databaseName: mediflow_ai
    user: mediflow_user
    plan: free
    region: oregon
    postgresMajorVersion: 16
