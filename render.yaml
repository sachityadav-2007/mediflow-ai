# =============================================================================
# MediFlow AI — Render Cloud Blueprint Specification
# Deploys Managed PostgreSQL, Node.js Express API, and React Frontend SPA
# =============================================================================
services:
  # 1. Backend REST API & Socket.IO Gateway
  - type: web
    name: mediflow-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && cd backend && npx prisma generate
    startCommand: cd backend && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        fromDatabase:
          name: mediflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://mediflow-frontend.onrender.com,https://mediflow.vercel.app

  # 2. Frontend React 18 Single-Page Application
  - type: web
    name: mediflow-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mediflow-api
          property: host

# 3. Managed PostgreSQL Database
databases:
  - name: mediflow-db
    databaseName: mediflow_ai
    user: mediflow_user
    plan: starter
    region: oregon
    postgresMajorVersion: 16

